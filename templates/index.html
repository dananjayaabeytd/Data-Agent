<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Data Agent</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">D</span><strong>Data Agent</strong></div>
      <button class="new-session" id="new-session" type="button">+ New session</button>
      <div class="section-label">Sessions</div>
      <div class="sessions" id="sessions" aria-live="polite"></div>
    </aside>

    <main class="workspace">
      <header class="topbar">
        <div>
          <div class="eyebrow">Unified data workspace</div>
          <h1 id="title">Loading session...</h1>
        </div>
        <div class="status" id="status">Ready</div>
      </header>

      <section class="chat" id="chat" aria-live="polite"></section>
      <div class="error" id="error" role="alert" hidden></div>

      <div class="composer-wrap">
        <form class="composer" id="form">
          <textarea id="message" rows="1" placeholder="Ask about your data, an API, or a transformation..."></textarea>
          <button class="send" id="send" type="submit">Send</button>
        </form>
        <div class="composer-hint">Enter to send - Shift+Enter for a new line</div>
      </div>
    </main>
  </div>
  <script src="/static/app.js" defer></script>
</body>
</html>
