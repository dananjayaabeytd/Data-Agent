services:
  postgres:
    image: postgres:16-alpine
    container_name: data-agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${database:?database must be set in .env}
      POSTGRES_USER: ${user:?user must be set in .env}
      POSTGRES_PASSWORD: ${password:?password must be set in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: data-agent-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      SESSION_AUTO_MIGRATE: "false"
      host: postgres
      port: 5432
      SESSION_BACKEND: postgres
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: ["uv", "run", "uvicorn", "api_app:app", "--host", "0.0.0.0", "--port", "8000"]

  migrate:
    build: .
    container_name: data-agent-migrate
    restart: "no"
    env_file:
      - .env
    environment:
      host: postgres
      port: 5432
    depends_on:
      postgres:
        condition: service_healthy
    command: ["uv", "run", "python", "db/migrate.py"]

volumes:
  postgres_data:
    driver: local
