name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run python -m unittest discover -s tests -v
      - run: uv run python -m compileall -q main.py api_app.py web_app.py feed_db.py agents Models utils tests
      - run: uv lock --check
      - run: docker build --check .